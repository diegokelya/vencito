name: Pruebas del sitio
on:
  pull_request:
    paths: ['assets/site.js', 'tests/**', 'package.json']
  push:
    branches: [main]
    paths: ['assets/site.js', 'tests/**', 'package.json']
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/
